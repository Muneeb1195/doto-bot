name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  dupcheck:
    # Fails if the same module-level function name is defined in more than one
    # file under scripts/ or tools/ (copy-pasted helpers must move to a shared
    # _common.py instead). Stdlib-only: no pip install needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Check duplicate function definitions
        run: python .github/scripts/check_duplicate_defs.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests
      - name: mypy
        run: mypy bot/ services/ --ignore-missing-imports --follow-imports=skip

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bot
          severity: error

  secret-scan:
    # Fail loudly on hardcoded secrets committed to source (agent audit D1/H3/H4).
    # config/credentials.ini is git-ignored and the live source of truth for
    # secrets, so it is excluded via .gitleaksignore. The grep fallback catches
    # obvious assignments (password =, DASHBOARD_PASS=, api_key =, token =)
    # in tracked .py/.ps1 files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITLEAKS_ENABLE_UPLOAD: "false"
          GITLEAKS_CONFIG: ""
      - name: Grep fallback for obvious secrets
        run: |
          echo "Scanning tracked .py/.ps1/.sh for hardcoded secret assignments..."
          matches=$(git ls-files '*.py' '*.ps1' '*.sh' | grep -vE 'tests/' | xargs grep -RIinE '(password|DASHBOARD_PASS|api_key|apikey|secret|token)[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"']{4,}' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::Possible hardcoded secret found:"
            echo "$matches"
            exit 1
          fi
          echo "No obvious hardcoded secrets detected."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # MetaTrader5 ships a Windows-only wheel, so the CI runner (Linux)
          # cannot install it. Tests mock the module at sys.modules level in
          # tests/conftest.py, so the real package is not required.
          grep -vE '^(MetaTrader5|mt5linux)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
          pip install pytest pytest-mock
      - name: Run tests
        run: pytest tests/ -v --tb=short
