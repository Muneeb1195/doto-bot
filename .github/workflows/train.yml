name: Train Models

# Training runs on GitHub runners ONLY -- there is deliberately no systemd
# timer for it on the home-server, which would otherwise compete with the live
# bot for CPU. The whole portfolio (8 per-symbol models + the asset-class pool
# models) completes in ~7 min here, so unlike optimize.yml this does not need
# to be sharded across a job matrix. doto-download.timer pulls the resulting
# models.tar.gz back to the home-server.

on:
  schedule:
    # Monthly, 1st Sunday 03:00 UTC -- 2h before optimize.yml so CPCV tunes
    # parameters against the models that were just published, rather than
    # against last cycle's. Weekly retraining churned models faster than the
    # (now monthly) parameter cycle could make use of.
    - cron: '0 3 1-7 * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      # POSIX cron ORs day-of-month with day-of-week when both are restricted,
      # so '0 3 1-7 * 0' can fire on every day 1-7 AND every Sunday. Gate on the
      # real condition so a scheduled run only proceeds on the 1st Sunday.
      - name: Guard first-Sunday schedule
        if: github.event_name == 'schedule'
        run: |
          DOM=$(date -u +%d); DOW=$(date -u +%u)
          if [ "$DOM" -gt 7 ] || [ "$DOW" -ne 7 ]; then
            echo "Not the first Sunday (day=$DOM dow=$DOW) - skipping."
            exit 1
          fi
          echo "First Sunday confirmed (day=$DOM)."
      - uses: actions/checkout@v7.0.1
        with:
          # Unlike optimize.yml this is a single job (not an 8-way matrix) and
          # it trains every symbol, so it legitimately needs all M1 files. That
          # is one ~814 MB LFS pull per run, which fits the free-tier budget;
          # the matrix job fetches per-symbol instead.
          lfs: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(MetaTrader5|mt5linux)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Train models
        run: |
          python bot/train_model.py --csv --retrain-all --pool --years 5.1
      - name: Package artifacts
        run: |
          tar czf models.tar.gz models/*.pkl models/*.calib.npz 2>/dev/null || true
      - name: Create release
        run: |
          TAG="train-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" models.tar.gz \
            --title "ML Models $(date +%Y-%m-%d)" \
            --notes "Weekly retrain — models"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"ML Training: $STATUS — $TAG\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}" || true
