name: Train Models

# Training runs on GitHub runners ONLY -- there is deliberately no systemd
# timer for it on the home-server, which would otherwise compete with the live
# bot for CPU. The whole portfolio (8 per-symbol models + the asset-class pool
# models) completes in ~7 min here, so unlike optimize.yml this does not need
# to be sharded across a job matrix.
#
# This workflow is dispatched by the home-server's doto-orchestrate timer
# (scripts/download_models.py --dispatch). The server runs training first,
# then optimization, and pulls the resulting artifacts back automatically.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # M1 market data is NOT in git (git-lfs). It flows via a `data-*`
          # GitHub release published by the home-server's scripts/push_data.py
          # after each export, so this job pulls it from the release instead
          # of a multi-GB LFS checkout.
          lfs: false
      - name: Fetch M1 market data
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[].tagName | select(startswith("data-"))] | first')
          if [ -z "$TAG" ]; then echo "No data-* release found"; exit 1; fi
          echo "Fetching M1 data from release $TAG"
          mkdir -p data/history
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_M1.csv' --dir data/history
          echo "M1 files: $(ls data/history/*_M1.csv 2>/dev/null | wc -l)"
          # Sanity check: files must be real CSVs, not LFS pointer files.
          if head -c 40 "$(ls data/history/*_M1.csv | head -1)" | grep -q 'git-lfs.github.com'; then
            echo "ERROR: downloaded file is a git-lfs pointer"; exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(MetaTrader5|mt5linux)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Train models
        run: |
          python bot/train_model.py --csv --retrain-all --pool --years 5.1
      - name: Package artifacts
        run: |
          tar czf models.tar.gz models/*.pkl models/*.calib.npz 2>/dev/null || true
      - name: Create release
        run: |
          TAG="train-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" models.tar.gz \
            --title "ML Models $(date +%Y-%m-%d)" \
            --notes "Models for the $(date +%Y-%m-%d) optimization cycle"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"ML Training: $STATUS — $TAG\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}" || true
