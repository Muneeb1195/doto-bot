name: Train Models

on:
  schedule:
    - cron: '0 3 * * 0'  # Sun 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(MetaTrader5|mt5linux)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Train models
        run: |
          python bot/train_model.py --csv --retrain-all --pool --years 3
      - name: Package artifacts
        run: |
          tar czf models.tar.gz models/*.pkl models/*.calib.npz 2>/dev/null || true
      - name: Create release
        run: |
          TAG="train-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" models.tar.gz \
            --title "ML Models $(date +%Y-%m-%d)" \
            --notes "Weekly retrain — models"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Discord
        if: always()
        run: |
          STATUS="${{ job.status }}"
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"ML Training: $STATUS — $TAG\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}" || true
