name: Optimize Strategy

# Optimization runs on GitHub runners ONLY. The home-server (i5-4250U, 4
# threads) needs ~23 min for a single 48-combo symbol and ~8h for the full
# portfolio, which would also contend with the live bot for CPU. Runners are
# ~2x faster per core and, more importantly, the symbols are sharded across a
# job matrix below so they run concurrently instead of end to end.

# Dispatched by the home-server's doto-orchestrate timer
# (scripts/download_models.py --dispatch), which runs it AFTER train.yml so
# CPCV optimizes against freshly published models. Default mode is CPCV
# monthly; 'weekly' remains available via workflow_dispatch for ad-hoc
# comparison.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Optimization mode (weekly = full-grid, for ad-hoc comparison)'
        required: false
        default: 'monthly'
        type: choice
        options: [monthly, weekly]

permissions:
  contents: write

jobs:
  # Resolve the mode once so every shard agrees, and read the portfolio from
  # settings.ini so the matrix stays in sync with the live symbol list.
  #
  # Also installs dependencies and downloads the trained models ONCE here,
  # then publishes them as an artifact for the matrix shards to consume.
  # Previously every shard pip-installed and re-downloaded models.tar.gz,
  # wasting ~(N-1) x (~90s pip + ~45s models) and discovering missing models
  # ~10 min into a shard. Now the early-fail check happens before any shard starts.
  setup:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.cfg.outputs.mode }}
      symbols: ${{ steps.cfg.outputs.symbols }}
      models_tag: ${{ steps.models.outputs.tag }}
      data_tag: ${{ steps.data.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      # No pip install here: every `python -c` in this job uses only the stdlib
      # (configparser/json), and deps do not survive into the other jobs anyway.
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      # Resolve the latest data-* release tag (published by the home-server's
      # scripts/push_data.py after each export). Shards use it to fetch their
      # own H1/M15/M1 CSVs instead of relying on git-tracked data/history
      # (which --no-git exports no longer update).
      - name: Resolve data release
        id: data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
                  --json tagName --jq '[.[].tagName | select(startswith("data-"))] | first')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No data-* release found; the home-server must run" \
                 "scripts/push_data.py (via doto-orchestrate) before training."
            exit 1
          fi
          echo "Using market data from release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      # models/*.pkl is gitignored, so without this the optimizer finds no model,
      # build_params() sets ml_enabled=False, and we tune parameters for a bot
      # with NO ML gate -- then apply them to a live bot that has one.
      # Download ONCE here and publish as an artifact; shards consume it.
      # The early-fail check verifies ALL portfolio models exist before any
      # shard starts, instead of discovering a missing model ~10 min in.
      - name: Fetch trained models
        id: models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
                  --json tagName --jq '[.[].tagName | select(startswith("train-"))] | first')
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "::error::No train-* release found; optimizing without ML would" \
                 "produce parameters that do not match live behaviour."
            exit 1
          fi
          echo "Using models from release $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'models.tar.gz' --dir /tmp
          # The tarball already contains a top-level models/ directory.
          tar xzf /tmp/models.tar.gz -C .
          # Verify ALL portfolio models exist BEFORE any shard starts.
          SYMBOLS=$(python -c "
          import configparser, json
          c = configparser.ConfigParser(); c.read('config/settings.ini')
          s = [x.strip() for x in c.get('PORTFOLIO','symbols',fallback='').split(',') if x.strip()]
          print(' '.join(s))
          ")
          MISSING=""
          for sym in $SYMBOLS; do
            SAFE="$(echo "$sym" | tr '.' '_')"
            if [ ! -f "models/model_${SAFE}.pkl" ]; then
              MISSING="$MISSING $sym"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Missing models for:$MISSING - refusing to optimize with ML gate silently disabled."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Models present: $(ls models/ | wc -l) files"
      - name: Publish models artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: trained-models
          path: models/
          retention-days: 1
      # No cron any more: runs are dispatched by the home-server, so there is
      # no first-Sunday gate. Mode is taken directly from the dispatch input.
      - id: cfg
        run: |
          MODE="${{ inputs.mode }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          SYMBOLS=$(python -c "
          import configparser, json
          c = configparser.ConfigParser(); c.read('config/settings.ini')
          s = [x.strip() for x in c.get('PORTFOLIO','symbols',fallback='').split(',') if x.strip()]
          print(json.dumps(s))
          ")
          echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE symbols=$SYMBOLS"

  # One job per symbol. A single symbol is 12-52 min, so sharding keeps every
  # job well inside the 6h limit even for monthly CPCV.
  optimize:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # 8 shards on shared runners produced a 7x wall-time spread (US30 217 min
      # vs US500 31 min on identical grids). The spread is CPU contention
      # across concurrent shards, not workload -- reduce to 4. The vectorized
      # calc_vidya + per-process MA caches (perf commits) plus the numba cache
      # have since cut the worst shards dramatically (SOLUSD/XRPUSD went from
      # ~328 min timeouts to ~22 min locally).
      max-parallel: 4
      matrix:
        symbol: ${{ fromJson(needs.setup.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # NOT lfs:true. This job is an 8-symbol matrix, and a blanket LFS
          # checkout would pull all 8 M1 files (~814 MB) into every shard =
          # ~6.5 GB per run, which blows the 10 GiB/month free-tier bandwidth
          # quota. Fetch only this shard's own M1 file instead (~100 MB).
          lfs: false
      # Trained models are downloaded ONCE in the setup job and published as the
      # "trained-models" artifact, so this shard consumes the artifact instead of
      # re-downloading the release. Dependencies still have to be installed here:
      # each job runs on its own fresh runner, so a pip install in the setup job
      # does NOT carry over. The pip cache below makes the repeat install cheap.
      #
      # The data-* release is rebuilt at the START of every doto-orchestrate
      # cycle (export + push_data.py), so downloading H1/M15/M1 from it is what
      # keeps this run on FRESH bars — the git-tracked data/history CSVs are no
      # longer updated by the export (which runs with --no-git).
      - name: Fetch H1/M15/M1 history for ${{ matrix.symbol }}
        run: |
          SAFE="$(echo '${{ matrix.symbol }}' | tr '.' '_')"
          TAG="${{ needs.setup.outputs.data_tag }}"
          mkdir -p data/history
          for TF in H1 M15 M1; do
            # --clobber: the git checkout already provides H1/M15 in
            # data/history; the release assets must replace them, not skip.
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "${SAFE}_${TF}.csv" --dir data/history --clobber
            F="data/history/${SAFE}_${TF}.csv"
            if [ ! -s "$F" ] || head -c 40 "$F" | grep -q 'git-lfs.github.com'; then
              echo "::error::$F did not materialise (missing asset or LFS pointer)."
              exit 1
            fi
            echo "${TF} rows: $(wc -l < "$F")"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(MetaTrader5|mt5linux)' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Download trained models
        uses: actions/download-artifact@v8.0.1
        with:
          name: trained-models
          path: models/
      # Persist the numba JIT cache across runs. bot/backtest_njit.py's 7
      # @njit(cache=True) kernels write compiled artifacts to
      # bot/__pycache__/*.nbc/*.nbi; without this each shard rebuilds them from
      # scratch (~65s per worker, 4 workers = ~4.3 min of pure compile). Key on a
      # hash of the kernel source AND the Python version -- the local cache
      # already holds both py312 and py314 artifacts, so an unkeyed cache would
      # silently miss when CI's Python version differs from a prior run.
      - name: Cache numba JIT kernels
        uses: actions/cache@v6.1.0
        with:
          path: bot/__pycache__
          key: numba-jit-${{ runner.os }}-py${{ matrix.python-version || '3.12' }}-${{ hashFiles('bot/backtest_njit.py') }}
          restore-keys: |
            numba-jit-${{ runner.os }}-py${{ matrix.python-version || '3.12' }}-
            numba-jit-${{ runner.os }}-
      - name: Optimize ${{ matrix.symbol }}
        env:
          # The JIT fast path is bit-exact with the reference loop and is now
          # default-on, but set it explicitly so the CI runtime characteristics
          # are visible in the workflow rather than implied by requirements.txt.
          DOTO_FAST_BACKTEST: "1"
        run: |
          MODE="${{ needs.setup.outputs.mode }}"
          # 5.1y satisfies two independent constraints: CPCV needs >=3.8y to
          # reach its full 15 paths (3y yielded only 6), and Bailey/Lopez de
          # Prado's MinBTL requires ~5.1y for our worst-case effective trial
          # count (profile B, 48 effective trials) before a backtest winner is
          # distinguishable from the best of N lucky draws.
          if [ "$MODE" = "monthly" ]; then FLAG="--cpcv"; else FLAG="--full-grid"; fi
          YEARS=5.1
          python bot/optimize_params.py --symbols "${{ matrix.symbol }}" --csv $FLAG --years $YEARS
      # optimize_params.py writes logs/optimize_<SYMBOL_WITH_UNDERSCORES>.csv
      # (symbol.replace('.', '_')), and the publish job maps that name back with
      # .replace('_', '.'). Interpolating ${{ matrix.symbol }} directly produced
      # "optimize_US500.raw.csv", which never exists, so the upload failed with
      # "No files were found". GitHub Actions has no replace() expression, so
      # derive the safe name in shell and pass it through an output.
      - name: Resolve result filename
        id: rf
        run: echo "safe=$(echo '${{ matrix.symbol }}' | tr '.' '_')" >> "$GITHUB_OUTPUT"
      - name: Upload result
        uses: actions/upload-artifact@v7.0.1
        with:
          name: optimize-${{ matrix.symbol }}
          # Upload ONLY this shard's own CSV. A glob here swept up any other
          # optimize_*.csv present on the runner, so stale results from earlier
          # code versions were republished as if they were current.
          path: logs/optimize_${{ steps.rf.outputs.safe }}.csv
          if-no-files-found: error
          retention-days: 7

  # Merge every shard's CSV into one strategy-params.json and publish it.
  publish:
    needs: [setup, optimize]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Download all shard results
        uses: actions/download-artifact@v8.0.1
        with:
          # run-id + pattern pin this to the CURRENT run's shards only.
          pattern: optimize-*
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/shards
          merge-multiple: true
      - name: Install merge deps
        run: pip install pandas
      - name: Build strategy-params.json
        run: |
          # Start from an EMPTY logs/ so nothing checked into the repo or left
          # by a previous step can masquerade as a fresh shard result.
          rm -rf logs && mkdir -p logs
          cp /tmp/shards/optimize_*.csv logs/ 2>/dev/null || true
          echo "Shard CSVs collected from this run:"
          ls -1 logs/ || echo "  (none)"
          python - <<'PY'
          import glob, json, math, os, configparser
          import pandas as pd

          # Reuse the SAME plateau picker the sequential auto_optimizer used.
          # Taking a plain argmax over wf_score would pick knife-edge parameter
          # sets that win by noise and are surrounded by poor neighbours; the
          # plateau picker instead takes the middle of the top-scoring cluster,
          # which is the whole point of having it.
          from scripts.plateau_picker import pick_middle_of_plateau

          settings = configparser.ConfigParser()
          settings.read('config/settings.ini')
          portfolio = {s.strip() for s in settings.get('PORTFOLIO', 'symbols', fallback='').split(',') if s.strip()}

          def num(row, key, default=float('nan')):
              try:
                  v = row.get(key)
                  return float(v) if v is not None and v == v else default
              except (TypeError, ValueError):
                  return default

          result, failed, skipped = {}, {}, []
          for path in sorted(glob.glob('logs/optimize_*.csv')):
              sym = os.path.basename(path).replace('optimize_', '').replace('.csv', '').replace('_', '.')
              if sym not in portfolio:
                  continue
              df = pd.read_csv(path)
              if df.empty:
                  continue

              rec = pick_middle_of_plateau(df, score_col='wf_score', pct=0.90, min_trades=3)
              if rec is None:
                  skipped.append(f'{sym}: no valid plateau')
                  continue

              def _to_params(r):
                  return {
                      'ema_fast_period': int(r['ema_fast']),
                      'ema_slow_period': int(r['ema_slow']),
                      'atr_sl_multiplier': float(r['sl']),
                      'risk_reward_ratio': float(r['rr']),
                      'adx_trend_threshold': int(r['adx']),
                      'scoring_min_entry': float(r['score']),
                  }

              # Multiple-testing guard: a walk-forward winner drawn from a large
              # search is not evidence of edge on its own. Skip publishing any
              # symbol whose result is indistinguishable from a lucky draw.
              #
              # A MISSING diagnostic is a rejection, not a pass. Treating NaN as
              # "fine" made the gate fail-open: a stale CSV written before these
              # columns existed sailed straight through ungated.
              if 'dsr' not in df.columns or 'pbo' not in df.columns:
                  skipped.append(f'{sym}: no DSR/PBO columns (stale or pre-gate CSV)')
                  failed[sym] = _to_params(rec)
                  continue
              dsr, pbo = num(rec, 'dsr'), num(rec, 'pbo')
              if math.isnan(dsr):
                  skipped.append(f'{sym}: DSR not computed')
                  failed[sym] = _to_params(rec)
                  continue
              if dsr < 0.95:
                  skipped.append(f'{sym}: DSR={dsr:.3f} < 0.95')
                  failed[sym] = _to_params(rec)
                  continue
              # PBO is legitimately NaN when there are too few candidates to
              # split, so only a computed value can reject.
              if not math.isnan(pbo) and pbo > 0.5:
                  skipped.append(f'{sym}: PBO={pbo:.2f} > 0.50')
                  failed[sym] = _to_params(rec)
                  continue

              result[sym] = _to_params(rec)
              print(f"  {sym}: EMA{int(rec['ema_fast'])}/{int(rec['ema_slow'])} "
                    f"SL={float(rec['sl']):.1f} RR={float(rec['rr']):.1f} "
                    f"ADX={int(rec['adx'])} score={float(rec['score']):.2f} "
                    f"(plateau pick, DSR={dsr:.3f} PBO={pbo})")

          # A symbol whose shard produced no CSV at all (crash, timeout) must be
          # reported rather than silently omitted -- otherwise a half-failed run
          # looks identical to a run where those symbols were simply rejected.
          seen = {
              os.path.basename(p).replace('optimize_', '').replace('.csv', '').replace('_', '.')
              for p in glob.glob('logs/optimize_*.csv')
          }
          for sym in sorted(portfolio - seen):
              skipped.append(f'{sym}: no result CSV (shard failed or timed out)')

          with open('strategy-params.json', 'w') as f:
              json.dump(result, f, indent=2)
          print(f'Published params for {len(result)}/{len(portfolio)} portfolio symbols')
          # Gate-failed symbols keep their best plateau params but the box
          # applies them with a TIGHTENED entry on the 1st consecutive
          # failure and PAUSES new entries on the 2nd+. Persisting them lets
          # the downloader enforce that policy locally instead of dropping
          # the symbol's params entirely. Always write the file (empty when
          # nothing failed) so the release always carries it.
          with open('failed-params.json', 'w') as f:
              json.dump(failed, f, indent=2)
          print(f'Failed gate ({len(failed)}): {", ".join(sorted(failed)) or "none"}')
          for s in skipped:
              print(f'  SKIPPED {s}')

          # A skipped symbol keeps whatever is already in settings.ini (the
          # downloader only touches symbols present in the JSON), so it silently
          # carries on with older parameters. That is the safe behaviour, but it
          # must not be invisible: persist the reasons so the release notes and
          # the Discord alert can surface them.
          with open('skipped.json', 'w') as f:
              json.dump(skipped, f, indent=2)
          PY
      - name: Create release
        run: |
          TAG="optimize-$(date +%Y%m%d-%H%M)"
          {
            echo "${{ needs.setup.outputs.mode }} optimization (sharded per symbol)."
            echo
            echo "Params are selected by pick_middle_of_plateau() and then gated on"
            echo "DSR >= 0.95 and PBO <= 0.50. A symbol that fails the gate lands in"
            echo "failed-params.json; the box applies its best params with a tightened"
            echo "entry on the 1st consecutive failure and pauses new entries on the"
            echo "2nd+ (existing positions still exit)."
            echo
            python - <<'PY'
          import json
          p = json.load(open('strategy-params.json'))
          s = json.load(open('skipped.json'))
          print(f"### Applied ({len(p)})")
          for k, v in sorted(p.items()):
              print(f"- {k}: EMA{v['ema_fast_period']}/{v['ema_slow_period']} "
                    f"SL={v['atr_sl_multiplier']} RR={v['risk_reward_ratio']} "
                    f"ADX={v['adx_trend_threshold']} score={v['scoring_min_entry']}")
          print()
          print(f"### Not applied ({len(s)})")
          for line in s:
              print(f"- {line}")
          PY
          } > notes.md
          gh release create "$TAG" strategy-params.json failed-params.json skipped.json logs/optimize_*.csv \
            --title "Strategy Params $(date +%Y-%m-%d)" \
            --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Notify Discord
        if: always()
        env:
          MODE: ${{ needs.setup.outputs.mode }}
          STATUS: ${{ job.status }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          def load(path, default):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception:
                  return default

          applied = load('strategy-params.json', {})
          failed = load('failed-params.json', {})
          skipped = load('skipped.json', [])

          msg = (f"Optimization ({os.environ['MODE']}): {os.environ['STATUS']} — "
                 f"{len(applied)} applied, {len(skipped)} not updated")
          if failed:
              shown = "; ".join(sorted(failed)[:4])
              extra = f" (+{len(failed) - 4} more)" if len(failed) > 4 else ""
              msg += f"\nHybrid policy (gate fail): {shown}{extra}"

          hook = os.environ.get('WEBHOOK')
          if not hook:
              print(msg)
              raise SystemExit(0)
          req = urllib.request.Request(
              hook,
              data=json.dumps({'content': msg}).encode(),
              headers={'Content-Type': 'application/json'},
          )
          try:
              urllib.request.urlopen(req, timeout=30)
          except Exception as e:
              print(f'Discord notify failed (non-fatal): {e}')
          print(msg)
          PY
